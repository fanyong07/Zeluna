name: Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.3
  UV_VERSION: 0.11.32

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Linux JavaScript runtime for VM tests
        run: |
          jsf_root="$(python3 -c 'import json, pathlib, urllib.parse; data=json.load(open(".dart_tool/package_config.json", encoding="utf-8")); uri=next(item["rootUri"] for item in data["packages"] if item["name"] == "jsf"); print(pathlib.Path(urllib.parse.urlparse(uri).path))')"
          cmake -S "$jsf_root/src" -B "$RUNNER_TEMP/jsf-linux" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/jsf-linux" --config Release --parallel 2
          test -f "$RUNNER_TEMP/jsf-linux/libjsf.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/jsf-linux${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Verify Dart formatting
        # The vendored WebView fork stays byte-comparable to its upstream
        # archive and is validated separately by the Windows job.
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Analyze Flutter sources
        run: flutter analyze --suppress-analytics
      - name: Run Flutter tests
        run: flutter test --reporter compact

  android:
    name: Android build and emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --suppress-analytics
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Launch debug APK on Android 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W -n app.anime.anime/.MainActivity > app-launch.txt
            sleep 5
            adb shell dumpsys activity activities | grep -m 3 -E 'mResumedActivity|topResumedActivity' > resumed-activity.txt
            grep -q 'app.anime.anime/.MainActivity' resumed-activity.txt
            adb shell dumpsys package app.anime.anime | grep -E 'versionName|versionCode' > app-version.txt
            adb shell pidof app.anime.anime | tr -d '\r' > app-pid.txt
            grep -Eq '[0-9]+' app-pid.txt
            bash -lc 'app_pid="$(tr -d "\r\n" < app-pid.txt)"; adb logcat -d --pid="$app_pid" > android-app-logcat.txt || true'
            bash -lc '! grep -E "FATAL EXCEPTION|ANR in app\\.anime\\.anime" android-app-logcat.txt'
            adb exec-out screencap -p > zeluna-android-emulator.png
            test -s zeluna-android-emulator.png
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-emulator-runtime
          path: |
            app-launch.txt
            resumed-activity.txt
            app-version.txt
            app-pid.txt
            android-app-logcat.txt
            zeluna-android-emulator.png
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows build and WebView fork
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --suppress-analytics
      - name: Verify immutable release outputs
        shell: pwsh
        run: ./tool/ci/test_release_immutability.ps1
      - name: Exercise local WebView fork lifecycle
        timeout-minutes: 15
        run: flutter test integration_test/animeko_webview_sniffer_integration_test.dart -d windows --reporter compact

  web:
    name: Web build and conditional stubs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --suppress-analytics

  python:
    name: Python, Alembic, lint, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen --all-groups
      - name: Compile Python sources
        run: uv run python -m compileall -q server tests tools
      - name: Run server and Alembic migration tests
        run: uv run pytest -q
      - name: Run Ruff correctness checks
        run: uv run ruff check .
      - name: Audit Python vulnerabilities
        run: uv run pip-audit --strict

  supply-chain:
    name: Secrets, licenses, advisories, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: flutter pub get --enforce-lockfile
      - run: uv sync --project server --frozen --all-groups
      - name: Verify repository artifact policy
        run: uv run --project server python tool/ci/repository_gate.py --root .
      - name: Generate Python CycloneDX SBOM
        run: uv export --project server --frozen --no-dev --preview-features sbom-export --quiet --format cyclonedx1.5 --output-file build/sbom/python.cdx.json
      - name: Verify advisories and licenses; generate Flutter SBOM
        run: uv run --project server python tool/ci/dependency_gate.py --root .
      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-reports
          path: |
            build/reports/*.json
            build/sbom/*.json
          if-no-files-found: warn
          retention-days: 14
