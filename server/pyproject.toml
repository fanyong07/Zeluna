[project]
name = "zeluna-server"
version = "1.0.0"
description = "Zeluna catalog, playback, account, and synchronization backend"
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "apscheduler>=3.10,<4",
  "bcrypt>=4,<6",
  "beautifulsoup4>=4.12,<5",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "protobuf>=5,<8",
  "pyjwt>=2.8,<3",
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=50,<51",
]

[dependency-groups]
dev = [
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
